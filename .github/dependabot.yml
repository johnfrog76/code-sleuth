# Weekly dependency updates, with minor and patch updates in one pull request per ecosystem. @types/node
# majors are ignored: the types follow the Node major the package runs on.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # @types/node follows the Node major the package runs on (24, per .nvmrc and engines), so its
      # majors wait for the runtime to move.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
