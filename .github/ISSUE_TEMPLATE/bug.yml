name: Something is wrong
description: A false positive, a miss, a crash, or output that doesn't match the docs.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. For a security problem, please don't open an issue: see SECURITY.md.
        Never paste a real secret, even a revoked one. Code Sleuth masks secrets in its output, but check anyway.
  - type: input
    id: command
    attributes:
      label: What you ran
      placeholder: code-sleuth --goal public
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened
      description: Paste the lines that matter.
      render: text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: shape
    attributes:
      label: The shape that tripped it
      description: For a false positive or a miss, a minimal line or file that shows it. Describe the shape, not someone's repository.
      render: text
  - type: input
    id: version
    attributes:
      label: Code Sleuth version
      description: code-sleuth --version
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Node version and operating system
      placeholder: Node 24.1.0 on macOS 15
