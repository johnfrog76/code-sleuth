# A release: a version tag pushed (v0.3.0) makes the GitHub Release for it, with that version's section of
# CHANGELOG.md as its notes and the packed package attached (code-sleuth-0.3.0.tgz). Nothing else starts it;
# the tag is the deliberate act, and it is never moved or made here.
#
# Two jobs, so the token that can write never sits beside npm ci: the first reads only, and tests, packs and
# takes the notes; the second holds no checkout and no install, and only publishes what the first made. No
# secret and no personal token: the default GITHUB_TOKEN with the one permission a release needs.
#
# It refuses, before anything is published, a tag that is not vX.Y.Z, a tag whose package.json names another
# version, a tag with no changelog section, and a tag that fails the tests. Like CI, it runs only in this
# repository, while it is public. No pull request starts it, so no fork's code ever runs here.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Test, pack and take the notes
    if: ${{ github.repository == 'johnfrog76/code-sleuth' && !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: test/selfrun.test.ts reads it, and a shallow clone reads not investigated.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # The tag is vX.Y.Z, and package.json names the same version, so the package is code-sleuth-X.Y.Z.tgz
      # and the README's link to it holds.
      - name: The tag names the package's version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The tag '$TAG' is not a version: a release tag reads vX.Y.Z." >&2
            exit 1
          fi
          version="${TAG#v}"
          package="$(node -p 'require("./package.json").version')"
          if [ "$package" != "$version" ]; then
            echo "The tag is $TAG, but package.json names $package." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # The version's section of the changelog: from its "## [X.Y.Z]" heading to the next "## [" heading. A tag
      # with no section, or an empty one, stops here, so a release never ships with empty notes.
      - name: The notes, from CHANGELOG.md
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/release"
          awk -v head="## [$VERSION]" '
            index($0, head) == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release/notes.md"; then
            echo "CHANGELOG.md has no section for $VERSION." >&2
            exit 1
          fi

      # npm ci installs and builds, through prepare. The tests run on what is tagged, before anything is packed.
      - run: npm ci
      - run: npm test

      - name: npm pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          npm pack --pack-destination "$RUNNER_TEMP/release"
          test -s "$RUNNER_TEMP/release/code-sleuth-$VERSION.tgz"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release
      # --verify-tag: the release is made from the tag that was pushed, never a new one.
      - name: gh release create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" "$RUNNER_TEMP"/release/code-sleuth-*.tgz \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release/notes.md"
